apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * React Native Android configuration
 */
react {
    // React Native folders use their default locations.
    // Firebase and native modules use autolinking.
    autolinkLibrariesWithApp()
}

/**
 * Proguard is disabled for release builds.
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore fallback when Hermes is disabled.
 */
def jscFlavor =
    'io.github.react-native-community:jsc-android-intl:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.indigipet"

    defaultConfig {
        applicationId "com.indigipet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    /**
     * Include your existing Numbers and Food recordings.
     *
     * From android/app/build.gradle:
     * ../../assets/audio = C:/IP/assets/audio
     *
     * The resulting Android package contains:
     * assets/numbers/...
     * assets/food/...
     */
    sourceSets {
        main {
            assets.srcDirs += file("../../assets/audio")
        }
    }

    /**
     * Audio files must remain uncompressed so that
     * Android can open them using AssetManager.openFd().
     */
    androidResources {
        noCompress += ["mp3", "wav"]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            // Replace the debug signing key before
            // publishing the application.
            signingConfig signingConfigs.debug

            minifyEnabled enableProguardInReleaseBuilds

            proguardFiles(
                getDefaultProguardFile(
                    "proguard-android-optimize.txt"
                ),
                "proguard-rules.pro"
            )
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}